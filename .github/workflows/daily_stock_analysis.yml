# 文件名: .github/workflows/daily_stock_analysis.yml
name: Daily Stock Analysis

on:
  schedule:
    # 每天 UTC 时间 1:30 运行，对应北京时间 9:30
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze stocks and send report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run daily stock analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          STOCKS: ${{ secrets.STOCKS }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          SEARCH_SERVICE: tavily
        run: |
          # 可以先把关键环境变量打印出来，方便排查
          echo "TAVILY_API_KEY: ${TAVILY_API_KEY:0:10}..." 
          python main.py
